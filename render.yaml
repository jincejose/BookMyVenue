services:
  - type: web
    name: bookmyvenue
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyvenue-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
      - key: APP_ENV
        value: production
      - key: PAYMENT_MODE
        value: razorpay
databases:
  - name: bookmyvenue-db
    databaseName: bookmyvenue
    user: bmv
    plan: 0.1c-256mb
    region: singapore
