services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookmyvenue
      POSTGRES_USER: bmv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmv -d bookmyvenue"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql://bmv:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/bookmyvenue
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-before-deploy}
      SEED_DEMO: "true"
      APP_ENV: ${APP_ENV:-development}
      PAYMENT_MODE: ${PAYMENT_MODE:-demo}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      PORT: 5000
    volumes:
      - venue_uploads:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  venue_uploads:
